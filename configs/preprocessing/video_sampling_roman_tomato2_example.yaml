input_stage: 00_capture/videos
output_stage: 01_frames/images

method: interval_seconds
interval_seconds: 1.0
every_n_frames: 1
target_count: null
start_seconds: 0.0
end_seconds: null

# The committed example is 1080p/29.97 fps H.264. Metadata probing avoids a
# full per-frame ffprobe scan and still gives deterministic source timestamps.
probe_mode: metadata
output_format: jpg
jpeg_qscale: 2
filename_prefix: frame_
filename_digits: 6
