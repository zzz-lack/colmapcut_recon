input_stage: 00_capture/videos
output_stage: 01_frames/images

method: interval_seconds
interval_seconds: 1.0
every_n_frames: 1
target_count: null
start_seconds: 0.0
end_seconds: null

# The source is a large constant-frame-rate 4K/60fps capture. Metadata mode
# avoids a full ffprobe frame scan and derives stable indices from nb_frames.
probe_mode: metadata
output_format: jpg
jpeg_qscale: 2
filename_prefix: frame_
filename_digits: 6
