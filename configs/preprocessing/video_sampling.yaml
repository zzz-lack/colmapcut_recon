input_stage: 00_capture/videos
output_stage: 01_frames/images

# interval_seconds: sample by presentation timestamp (works with variable-frame-rate video)
# every_n_frames: keep every Nth decoded frame
# target_count: distribute a fixed number of images over the selected time range
method: interval_seconds
interval_seconds: 1.0
every_n_frames: 1
target_count: null
start_seconds: 0.0
end_seconds: null

output_format: jpg
jpeg_qscale: 2  # ffmpeg JPEG scale: 1 is highest quality, 31 is lowest
filename_prefix: frame_
filename_digits: 6
